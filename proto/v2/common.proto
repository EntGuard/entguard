syntax = "proto3";

package proto.v2;

option go_package = "github.com/entguard/entguard/proto/v2;pbapi";

// Error codes for gRPC APIs.
// For more information: https://grpc.github.io/grpc/core/md_doc_statuscodes.html
enum RPCErrorCode {
  RPC_ERROR_CODE_UNSPECIFIED = 0;
  RPC_ERROR_CODE_OK = 1;
  RPC_ERROR_CODE_CANCELLED = 2;
  RPC_ERROR_CODE_UNKNOWN = 3;
  RPC_ERROR_CODE_INVALID_ARGUMENT = 4;
  RPC_ERROR_CODE_DEADLINE_EXCEEDED = 5;
  RPC_ERROR_CODE_NOT_FOUND = 6;
  RPC_ERROR_CODE_ALREADY_EXISTS = 7;
  RPC_ERROR_CODE_PERMISSION_DENIED = 8;
  RPC_ERROR_CODE_RESOURCE_EXHAUSTED = 9;
  RPC_ERROR_CODE_FAILED_PRECONDITION = 10;
  RPC_ERROR_CODE_ABORTED = 11;
  RPC_ERROR_CODE_OUT_OF_RANGE = 12;
  RPC_ERROR_CODE_UNIMPLEMENTED = 13;
  RPC_ERROR_CODE_INTERNAL = 14;
  RPC_ERROR_CODE_UNAVAILABLE = 15;
  RPC_ERROR_CODE_DATA_LOSS = 16;
  RPC_ERROR_CODE_UNAUTHENTICATED = 17;
}

message RPCStatus {
  RPCErrorCode code = 1;
  string message = 2;
}

message Subscribe {}
