<div class="dialog-wrap" mat-dialog-content>
    <div class="flex">
        <h3 class="flex-1">{{ 'mfa-certificates-issuer-dialog.headerCRLCertIssuer' | translate }}</h3>
    </div>
    <textarea
        [value]="issuer"
        rows="10"
        cols="50"
        readonly
        class="w-full p-3 border border-gray-300 rounded bg-gray-50 text-gray-800 font-mono"
    ></textarea>
    <div mat-dialog-actions class="flex mt-2" dir="rtl">
        <button id="confirmation_close_button" class="ml-2" mat-raised-button mat-dialog-close (click)="closeDialog()">
            {{ 'mfa-certificates-issuer-dialog.buttonClose' | translate }}
        </button>
        <span class="flex-1"></span>
    </div>
</div>
