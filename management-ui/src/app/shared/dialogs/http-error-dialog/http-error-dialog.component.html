<div class="dialog-wrap flex flex-col min-w-[300px] p-4">
    <h1 class="error text-xl font-semibold mb-3" mat-dialog-title>{{ "http-error.error" | translate }}</h1>
    <div mat-dialog-content class="flex-1 mb-4">
        <p class="error">{{ data.errorMessage }}</p>
    </div>
    <div dir="rtl">
        <button mat-button mat-dialog-close>{{ "shared.buttonOk" | translate }}</button>
    </div>
</div>
